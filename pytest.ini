[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    engine: Structural design calculations (RC, Steel, DB, Solver, P-M diagram) tests
    api: FastAPI endpoints, request/response schemas, and payload tests
    ui: Web UI static templates, assets, and integration tests
