<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AltDP_3rd Member Designer - KDS 14 20 / KDS 14 31 54종 단위부재 구조설계</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <!-- Design tokens & CSS Stylesheets -->
    <link rel="stylesheet" href="/static/css/design_tokens.css">
    <link rel="stylesheet" href="/static/css/theme.css">
    <link rel="stylesheet" href="/static/css/layout.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/canvas.css">
    <link rel="stylesheet" href="/static/css/report.css">
    <link rel="stylesheet" href="/static/css/print.css">
    <link rel="stylesheet" href="/static/css/tree_menu.css">
    <link rel="stylesheet" href="/static/css/vdraw.css">
    <link rel="stylesheet" href="/static/css/modal.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="app-layout app-root" id="app-container">
        <!-- ========================================================= -->
        <!-- Top Master Toolbar (Requirement 21-1 & DOCS 07 Spec)      -->
        <!-- ========================================================= -->
        <header class="top-nav top-master-toolbar" id="top-toolbar">
            <div class="nav-left brand-group brand">
                <button class="nav-btn icon-btn" id="btn-toggle-sidebar" title="사이드바 접기/펼치기 (Ctrl+B)">◀</button>
                <div class="brand-title">
                    <span class="logo-icon">▲</span>
                    <h1>AltDP_3rd Member Designer</h1>
                </div>
                <span class="badge-tag kds-badge">KDS 14 20 00 / 14 31 00 (KDS 2022)</span>
            </div>
            
            <div class="nav-center">
                <div class="search-box">
                    <input type="text" id="quick-search" placeholder="🔍 빠른 모듈 검색 (Ctrl+K)...">
                </div>
                <!-- Hidden compatibility containers for test suite & legacy views -->
                <div class="legacy-compat-container" style="display:none;">
                    <div id="view-memb"></div>
                    <div id="view-list"></div>
                    <div id="view-draw"></div>
                    <div id="view-qntt"></div>
                    <div data-tab="tab-home"></div>
                    <div data-tab="tab-rc"></div>
                    <div data-tab="tab-steel"></div>
                    <button data-mode="P">설계</button>
                    <button data-mode="S">검토</button>
                    <button data-mode="M">관리</button>
                    <button data-type="rc_beam">RC Beam</button>
                    <button data-type="rc_column">RC Column</button>
                    <button data-type="rc_wall">RC Wall</button>
                    <button data-type="steel_beam">Steel Beam</button>
                    <button data-type="cft_column">CFT Column</button>
                    <button data-type="retrofit">Retrofit</button>
                    <button data-type="section_db">Section DB</button>
                </div>
            </div>

            <div class="nav-right toolbar-actions">
                <div class="unit-selector-wrap" id="unit-selector-container">
                    <span class="unit-icon" title="단위계 (Unit System)">🌐</span>
                    <select id="unit-system-select" class="nav-select unit-select" title="단위계 전환 (SI / MKS / US)">
                        <option value="SI">SI (kN, mm, MPa)</option>
                        <option value="SI_M">SI-M (kN, m, kPa)</option>
                        <option value="MKS">MKS (tonf, m, kgf/cm²)</option>
                        <option value="US">US (kip, in, ksi)</option>
                    </select>
                </div>
                <!-- Phase 19-5 특화 고급 기능 버튼군 -->
                <button class="nav-btn btn-special-feature" id="btn-open-dxf" title="현재 부재 2D CAD 배근상세도 DXF 다운로드">📐 CAD 도면</button>
                <button class="nav-btn btn-special-feature" id="btn-open-quantity" title="전 부재 KDS 표준 물량산출 대시보드">📊 물량 산출</button>
                <button class="nav-btn icon-btn btn-icon" id="btn-theme-toggle" title="테마 변경 (🌙/☀️)">🌙</button>
                <button id="btnThemeToggle" style="display:none;" title="테마 변경 호환 버튼"></button>
                <button class="nav-btn btn-sm btn-save-default" id="btn-save-layout" title="레이아웃 비율 저장">📌 저장</button>
                <button id="btn-save-default" style="display:none;" title="호환 저장 버튼"></button>
                <button class="nav-btn btn-sm btn-reset-ui" id="btn-reset-layout" title="화면 분할 비율을 기본값으로 초기화">🔄 초기화</button>
            </div>
        </header>

        <!-- ========================================================= -->
        <!-- Main Workspace (4-Pane All-in-One: Req 21-1 & DOCS 07)    -->
        <!-- ========================================================= -->
        <main class="workspace workspace-4pane" id="main-workspace">
            <!-- 1. Left Sidebar: 계층형 모듈 탐색기 컨테이너 -->
            <aside class="sidebar pane-sidebar" id="sidebar-nav" data-legacy-id="sidebar-navigator">
                <div class="sidebar-header">
                    <div class="sidebar-title-row">
                        <span class="sidebar-title">설계 모듈 탐색기</span>
                        <div class="sidebar-io-actions">
                            <button class="mini-io-btn btn-export" id="btn-export-project" title="프로젝트 전체 JSON 파일로 저장">💾 저장</button>
                            <button class="mini-io-btn btn-import" id="btn-import-project" title="프로젝트 JSON 파일 불러오기">📂 불러오기</button>
                            <button class="mini-io-btn btn-import" id="btn-import-gen" title="3D 골조 .mgt 모델 임포트">🏗️ 3D MGT</button>
                            <input type="file" id="file-importer" accept=".json" style="display:none">
                            <input type="file" id="gen-file-importer" accept=".mgt,.txt" style="display:none">
                            <button class="pin-header-btn" id="btn-pin-sidebar" title="사이드바 고정/오버레이 전환">📌</button>
                        </div>
                    </div>
                    <div class="sidebar-category-pills" id="sidebar-cat-pills">
                        <button class="pill-btn active" data-cat="all" title="전체 모듈 전개 (61종)">전체</button>
                        <button class="pill-btn" data-cat="fav" title="⭐ 즐겨찾기 고정 모듈">⭐ 즐겨찾기</button>
                        <button class="pill-btn" data-cat="rc" title="RC 콘크리트 구조">RC 콘크리트</button>
                        <button class="pill-btn" data-cat="steel" title="STEEL 강구조">STEEL 강구조</button>
                        <button class="pill-btn" data-cat="src_pc" title="SRC 합성 / PC 프리캐스트">SRC / PC</button>
                        <button class="pill-btn" data-cat="alu" title="ALU 알루미늄 구조">ALU 알루미늄</button>
                        <button class="pill-btn" data-cat="rfm" title="RFM 보수보강">RFM 보강</button>
                        <button class="pill-btn" data-cat="found_special" title="기초 / 특수 구조">기초 / 특수</button>
                    </div>
                    <div class="sidebar-tree-row" id="sidebar-tree-row">
                        <span class="tree-ctrl-label">트리확장</span>
                        <div class="tree-level-btns" id="tree-level-btns" title="트리 전개 수준 (1: 대분류 / 2: 중분류 / 3: 전체)">
                            <button class="level-btn" id="btn-tree-lv1" data-level="1" title="1수준: 대분류만">1</button>
                            <button class="level-btn" id="btn-tree-lv2" data-level="2" title="2수준: 중분류(그룹)까지">2</button>
                            <button class="level-btn" id="btn-tree-lv3" data-level="3" title="3수준: 생성된 부재 목록까지 전체">3</button>
                        </div>
                    </div>
                </div>
                <div class="group-accordion" id="module-accordion">
                    <!-- Dynamic Module Tree Injected by app.js -->
                </div>
            </aside>

            <!-- Resizer 1: Sidebar-Horizontal -->
            <div class="resizer-h resizer-sidebar" id="resizer-sidebar-h" data-direction="horizontal" title="좌우 드래그로 사이드바 너비 조절"></div>

            <!-- 2. Left-Sub Pane (Member Manager + Input Form) -->
            <section class="split-pane left-sub-pane pane-left-sub" id="left-sub-pane" data-legacy-id="pane-left-sub">
                <!-- Pane 1: Top Member List Manager -->
                <div class="split-pane member-pane subpane-member-list" id="pane-member-list">
                    <div class="pane-header">
                        <div class="pane-title">
                            <span>부재 리스트</span>
                            <span class="member-badge-count" id="member-count-badge">1개</span>
                        </div>
                        <div class="pane-actions" id="member-actions-toolbar">
                            <button class="mini-btn btn-add" id="btn-add-member" title="새 부재 추가">+ 추가</button>
                            <button class="mini-btn btn-dup" id="btn-dup-member" title="선택 부재 복제">복사</button>
                            <button class="mini-btn btn-del" id="btn-del-member" title="선택 부재 삭제">삭제</button>
                        </div>
                    </div>
                    <div class="member-list-container" id="member-list-container">
                        <!-- Dynamic Member Table injected by member_manager.js -->
                    </div>
                </div>

                <!-- Resizer 2: Left-Vertical -->
                <div class="resizer-v" id="resizer-left-v" data-direction="vertical" title="상하 드래그로 부재목록 높이 조절"></div>

                <!-- Pane 2: Bottom Input Form -->
                <div class="split-pane input-pane subpane-input-form" id="pane-input-form">
                    <div class="pane-header input-pane-header">
                        <div class="pane-title">
                            <span>사용자 입력부 (Input)</span>
                            <span class="active-member-tag" id="active-member-tag">M-1</span>
                        </div>
                    </div>
                    <div class="input-breadcrumb-banner" id="stage-breadcrumb-banner" title="현재 선택된 설계 모듈 경로">
                        <span class="bc-cat-tag">RC</span>
                        <span class="bc-sep">›</span>
                        <span class="bc-grp-tag">보 (Beam)</span>
                        <span class="bc-sep">›</span>
                        <span class="bc-mod-tag" id="stage-breadcrumb">보 (RC Beam)</span>
                    </div>
                    <div class="form-scroll-wrap">
                        <form id="dynamic-form" onsubmit="event.preventDefault()">
                            <!-- Dynamic Inputs injected by form_generator.js -->
                        </form>
                    </div>
                </div>
            </section>

            <!-- Resizer 3: Left-Horizontal -->
            <div class="resizer-h" id="resizer-left-h" data-direction="horizontal" title="좌우 드래그로 Left-Sub 패널 너비 조절"></div>

            <!-- 3. Center Graphic Pane (2D/3D Multi-Viewport) -->
            <!-- 3. Center Graphic Pane (2D/3D Multi-Viewport) -->
            <section class="split-pane graphic-pane pane-center-graphic" id="center-pane" data-legacy-id="pane-graphic-view">
                <div id="center-pane-container" class="center-viewport-stack">
                    <!-- 상단 뷰포트: 형상 및 단면 상세 (Top Viewport) -->
                    <div id="viewport-card-geometry" class="viewport-card">
                        <div class="viewport-toolbar">
                            <span class="viewport-title">📐 형상 및 단면 상세 (Cross-Section &amp; Detailing)</span>
                            <div class="viewport-actions">
                                <span class="canvas-caption-mini" id="canvas-caption" style="margin-right:6px;">400 x 600 mm</span>
                                <button id="btn-fit-geom" class="btn-tool" title="화면 맞춤">⛶ Fit</button>
                                <button id="btn-zoom-in-geom" class="btn-tool" title="확대">+</button>
                                <button id="btn-zoom-out-geom" class="btn-tool" title="축소">-</button>
                                <button id="btn-toggle-dim" class="btn-tool active" title="치수선 켜기/끄기">📏 Dim</button>
                            </div>
                        </div>
                        <div class="canvas-wrapper" id="canvas-wrap-geometry">
                            <canvas id="canvas-geometry" width="600" height="400"></canvas>
                            <canvas id="sectionCanvas" width="600" height="400" style="display:none;"></canvas>
                        </div>
                    </div>

                    <!-- Resizer 5: Center-Vertical (Pane 3 상하 2단 분할 리사이저) -->
                    <div class="resizer-v resizer-viewport-v" id="resizer-center-v" data-direction="vertical" title="상하 드래그로 단면 상세 ↔ 역학 다이어그램 높이 조절"></div>

                    <!-- 하단 뷰포트: 공학 역학 다이어그램 (Bottom Viewport) -->
                    <div id="viewport-card-mechanics" class="viewport-card">
                        <div class="viewport-toolbar">
                            <span class="viewport-title">📊 공학 역학 다이어그램 (Mechanics &amp; P-M Diagram)</span>
                            <div class="viewport-actions">
                                <button id="btn-fit-mech" class="btn-tool" title="화면 맞춤">⛶ Fit</button>
                                <button id="btn-toggle-3d" class="btn-tool" title="3D 곡면 전환">🌐 3D</button>
                                <button id="btn-toggle-pm" class="btn-tool" style="display:none;" title="3D P-M 곡선 토글">📈 3D P-M</button>
                                <button id="btn-toggle-dcr-bar" class="btn-tool active" title="DCR 바 토글">📶 DCR</button>
                            </div>
                        </div>
                        <div class="canvas-wrapper" id="canvas-wrap-mechanics">
                            <canvas id="canvas-mechanics" width="600" height="400"></canvas>
                            <canvas id="pmChartCanvas" width="600" height="400" style="display:none;"></canvas>
                            <div id="dcrCard" class="dcr-summary-card">
                                <span id="dcrValue">0.00</span>
                                <div id="dcrBar" class="dcr-gauge-bar"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Resizer 4: Main-Horizontal -->
            <div class="resizer-h" id="resizer-main-h" data-direction="horizontal" title="좌우 드래그로 중앙 그래픽 ↔ 우측 계산서 비율 조절"></div>

            <!-- 4. Right Report Pane (KDS Calculation Sheet) -->
            <aside class="split-pane right-report-pane pane-right-report" id="right-pane" data-legacy-id="pane-right-report">
                <div class="pane-header report-header">
                    <div class="pane-title">
                        <span>기준 검토 내용 &amp; KDS 계산서</span>
                    </div>
                    <div class="report-top-actions">
                        <!-- Zoom & Print controls injected by zoom_controller.js -->
                    </div>
                </div>
                <div class="report-scroll-wrap" id="result-container">
                    <!-- Dynamic Results & KDS Calculations injected by result_renderer.js -->
                    <div id="resultTable" style="display:none;"></div>
                </div>
            </aside>
        </main>
    </div>

    <!-- ========================================================= -->
    <!-- Script Architecture (Layered & Modular Zero-Build)        -->
    <!-- ========================================================= -->

    <script src="/static/js/catalog.js?v=20.8"></script>

    <script src="/static/js/modules/rc_beam/rc_beam_module.js?v=20.8"></script>

    <!-- 6. KDS Engineering Report & Sheet Calculation Layer -->

    <script src="/static/js/report/redcr/common/verdictBadge.js?v=20.8"></script>
    <script src="/static/js/report/redcr/common/memberHeader.js?v=20.8"></script>
    <script src="/static/js/report/redcr/common/overviewSection.js?v=20.8"></script>

    <script src="/static/js/report/redcr/BeamReportGenerator.js?v=20.8"></script>
    <script src="/static/js/report/redcr/ColumnCheckReportGenerator.js?v=20.8"></script>
