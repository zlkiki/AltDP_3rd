<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AltDP_3rd Member Designer - KDS 14 20 / KDS 14 31 54종 단위부재 구조설계</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <!-- Design tokens & CSS Stylesheets -->
    <link rel="stylesheet" href="/static/css/design_tokens.css">
    <link rel="stylesheet" href="/static/css/theme.css">
    <link rel="stylesheet" href="/static/css/layout.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/canvas.css">
    <link rel="stylesheet" href="/static/css/report.css">
    <link rel="stylesheet" href="/static/css/print.css">
    <link rel="stylesheet" href="/static/css/tree_menu.css">
    <link rel="stylesheet" href="/static/css/vdraw.css">
    <link rel="stylesheet" href="/static/css/modal.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="app-layout">
        <!-- ========================================================= -->
        <!-- Top Master Toolbar (브랜드, 사이드바 토글, 검색, 테마, 단위계, 액션) -->
        <!-- ========================================================= -->
        <header class="top-nav">
            <div class="nav-left">
                <button class="nav-btn icon-btn" id="btn-toggle-sidebar" title="사이드바 접기/펼치기 (Ctrl+B)">◀</button>
                <div class="brand">
                    <span class="logo-icon">▲</span>
                    <h1>AltDP_3rd Member Designer</h1>
                    <span class="badge-tag">KDS 14 20 00 / KDS 14 31 00</span>
                </div>
            </div>
            
            <div class="nav-center">
                <div class="search-box">
                    <input type="text" id="quick-search" placeholder="🔍 빠른 모듈 검색 (Ctrl+K)...">
                </div>
                <!-- Hidden compatibility containers for test suite & legacy views -->
                <div class="legacy-compat-container" style="display:none;">
                    <div id="view-memb"></div>
                    <div id="view-list"></div>
                    <div id="view-draw"></div>
                    <div id="view-qntt"></div>
                    <div data-tab="tab-home"></div>
                    <div data-tab="tab-rc"></div>
                    <div data-tab="tab-steel"></div>
                    <button data-mode="P">설계</button>
                    <button data-mode="S">검토</button>
                    <button data-mode="M">관리</button>
                    <button data-type="rc_beam">RC Beam</button>
                    <button data-type="rc_column">RC Column</button>
                    <button data-type="rc_wall">RC Wall</button>
                    <button data-type="steel_beam">Steel Beam</button>
                    <button data-type="cft_column">CFT Column</button>
                    <button data-type="retrofit">Retrofit</button>
                    <button data-type="section_db">Section DB</button>
                </div>
            </div>

            <div class="nav-right">
                <div class="unit-selector-wrap">
                    <span class="unit-icon" title="단위계 (Unit System)">🌐</span>
                    <select id="unit-system-select" class="nav-select unit-select" title="단위계 전환 (SI / MKS / US)">
                        <option value="SI">SI (kN, mm, MPa)</option>
                        <option value="SI_M">SI-M (kN, m, kPa)</option>
                        <option value="MKS">MKS (tonf, m, kgf/cm²)</option>
                        <option value="US">US (kip, in, ksi)</option>
                    </select>
                </div>
                <!-- Phase 19-5 특화 고급 기능 버튼군 -->
                <button class="nav-btn btn-special-feature" id="btn-open-dxf" title="현재 부재 2D CAD 배근상세도 DXF 다운로드">📐 CAD 도면</button>
                <button class="nav-btn btn-special-feature" id="btn-open-quantity" title="전 부재 KDS 표준 물량산출 대시보드">📊 물량 산출</button>
                <button class="nav-btn icon-btn" id="btn-theme-toggle" title="테마 변경 (다크/라이트)">🌙</button>
                <button id="btnThemeToggle" style="display:none;" title="테마 변경 호환 버튼"></button>
                <button class="nav-btn btn-save-default" id="btn-save-default" title="현재 레이아웃과 색상 테마를 기본값으로 저장">📌 레이아웃 기본값으로 저장</button>
                <button class="nav-btn btn-reset-ui" id="btn-reset-layout" title="화면 분할 비율을 기본값으로 초기화">🔄 레이아웃 초기화</button>
            </div>
        </header>

        <!-- ========================================================= -->
        <!-- Main Workspace (사이드바 + 4대 전문 분할 영역) -->
        <!-- ========================================================= -->
        <div class="workspace" id="main-workspace">
            <!-- Left Sidebar (1·2·3단계 통합 카테고리 & 모듈 트리) -->
            <aside class="sidebar" id="sidebar-navigator">
                <div class="sidebar-header">
                    <div class="sidebar-title-row">
                        <span class="sidebar-title">설계 모듈 탐색기</span>
                        <div class="sidebar-io-actions">
                            <button class="mini-io-btn btn-export" id="btn-export-project" title="프로젝트 전체 JSON 파일로 저장">💾 저장</button>
                            <button class="mini-io-btn btn-import" id="btn-import-project" title="프로젝트 JSON 파일 불러오기">📂 불러오기</button>
                            <button class="mini-io-btn btn-import" id="btn-import-gen" title="MIDAS Gen .mgt 모델 임포트">🏗️ Gen</button>
                            <input type="file" id="file-importer" accept=".json" style="display:none">
                            <input type="file" id="gen-file-importer" accept=".mgt,.txt" style="display:none">
                            <button class="pin-header-btn" id="btn-pin-sidebar" title="사이드바 고정/오버레이 전환">📌</button>
                        </div>
                    </div>
                    <div class="sidebar-category-pills" id="sidebar-cat-pills">
                        <button class="pill-btn active" data-cat="all">전체</button>
                        <button class="pill-btn" data-cat="rc">RC</button>
                        <button class="pill-btn" data-cat="steel">Steel</button>
                        <button class="pill-btn" data-cat="pc">PC</button>
                        <button class="pill-btn" data-cat="misc">기타</button>
                    </div>
                    <div class="sidebar-tree-row" id="sidebar-tree-row">
                        <span class="tree-ctrl-label">트리확장</span>
                        <div class="tree-level-btns" id="tree-level-btns" title="트리 전개 수준 (1: 대분류 / 2: 중분류 / 3: 전체)">
                            <button class="level-btn" id="btn-tree-lv1" data-level="1" title="1수준: 대분류만">1</button>
                            <button class="level-btn" id="btn-tree-lv2" data-level="2" title="2수준: 중분류(그룹)까지">2</button>
                            <button class="level-btn" id="btn-tree-lv3" data-level="3" title="3수준: 생성된 부재 목록까지 전체">3</button>
                        </div>
                    </div>
                </div>
                <div class="group-accordion" id="module-accordion">
                    <!-- Dynamic Module Tree Injected by app.js -->
                </div>
            </aside>

            <!-- Horizontal Resizer 0: Sidebar <-> Workspace Body -->
            <div class="resizer-h resizer-sidebar" id="resizer-sidebar-h" title="좌우 드래그로 사이드바 너비 조절"></div>

            <!-- Workspace Body: 4-Split Interactive Panes -->
            <main class="workspace-body" id="workspace-body">
                <!-- ===================================================== -->
                <!-- Pane 1 & 2 & 3: Left Main Area (Member, Form, Visual) -->
                <!-- ===================================================== -->
                <div class="split-pane left-main-pane" id="pane-left-main">
                    <!-- Left-Sub Area: Member List (Top) + Input Form (Bottom) -->
                    <div class="split-pane left-sub-pane" id="pane-left-sub">
                        <!-- Pane 1: Top Member List Manager -->
                        <section class="split-pane member-pane" id="pane-member-list">
                            <div class="pane-header">
                                <div class="pane-title">
                                    <span>부재 리스트</span>
                                    <span class="member-badge-count" id="member-count-badge">1개</span>
                                </div>
                                <div class="pane-actions" id="member-actions-toolbar">
                                    <button class="mini-btn btn-add" id="btn-add-member" title="새 부재 추가">+ 추가</button>
                                    <button class="mini-btn btn-dup" id="btn-dup-member" title="선택 부재 복제">복사</button>
                                    <button class="mini-btn btn-del" id="btn-del-member" title="선택 부재 삭제">삭제</button>
                                </div>
                            </div>
                            <div class="member-list-container" id="member-list-container">
                                <!-- Dynamic Member Table injected by member_manager.js -->
                            </div>
                        </section>

                        <!-- Vertical Resizer 3: Member List <-> Input Form -->
                        <div class="resizer-v" id="resizer-left-v" title="상하 드래그로 크기 조절"></div>

                        <!-- Pane 2: Bottom Input Form -->
                        <section class="split-pane input-pane" id="pane-input-form">
                            <div class="pane-header input-pane-header">
                                <div class="pane-title">
                                    <span>사용자 입력부 (Input)</span>
                                    <span class="active-member-tag" id="active-member-tag">M-1</span>
                                </div>
                            </div>
                            <div class="input-breadcrumb-banner" id="stage-breadcrumb-banner" title="현재 선택된 설계 모듈 경로">
                                <span class="bc-cat-tag">RC</span>
                                <span class="bc-sep">›</span>
                                <span class="bc-grp-tag">보 (Beam)</span>
                                <span class="bc-sep">›</span>
                                <span class="bc-mod-tag" id="stage-breadcrumb">보 (RC Beam)</span>
                            </div>
                            <div class="form-scroll-wrap">
                                <form id="dynamic-form" onsubmit="event.preventDefault()">
                                    <!-- Dynamic Inputs injected by form_generator.js -->
                                </form>
                            </div>
                        </section>
                    </div>

                    <!-- Horizontal Resizer 2: Left-Sub <-> Graphic View -->
                    <div class="resizer-h" id="resizer-left-h" title="좌우 드래그로 크기 조절"></div>

                    <!-- Pane 3: Left-Right Graphic Information View -->
                    <section class="split-pane graphic-pane" id="pane-graphic-view">
                        <div class="pane-header">
                            <div class="pane-title">
                                <span>그래픽 정보부 (Graphic View)</span>
                            </div>
                            <div class="graphic-toolbar">
                                <span class="canvas-caption-mini" id="canvas-caption">400 x 600 mm</span>
                                <button class="mini-btn" id="btn-toggle-pm" title="3D P-M 곡선 토글">📈 3D P-M</button>
                                <button class="mini-btn" id="btn-fit-canvas" title="단면도 크기 맞춤">🔍 리셋</button>
                            </div>
                        </div>
                        <div class="canvas-viewport">
                            <div class="canvas-wrap" id="canvas-wrap">
                                <canvas id="sectionCanvas" width="360" height="360"></canvas>
                                <canvas id="pmChartCanvas" width="360" height="360" style="display:none;"></canvas>
                                <div id="dcrCard" class="dcr-summary-card" style="display:none;">
                                    <span id="dcrValue">0.00</span>
                                    <div id="dcrBar" class="dcr-gauge-bar"></div>
                                </div>
                            </div>
                        </div>
                    </section>
                </div>

                <!-- Horizontal Resizer 1: Main Left Area <-> Right Report Area -->
                <div class="resizer-h" id="resizer-main-h" title="메인 좌우 드래그로 크기 조절"></div>

                <!-- ===================================================== -->
                <!-- Pane 4: Right Main Area (Design Check & KDS Report)   -->
                <!-- ===================================================== -->
                <aside class="split-pane right-report-pane" id="pane-right-report">
                    <div class="pane-header report-header">
                        <div class="pane-title">
                            <span>기준 검토 내용 &amp; KDS 계산서</span>
                        </div>
                        <div class="report-top-actions">
                            <!-- Zoom & Print controls injected by zoom_controller.js -->
                        </div>
                    </div>
                    <div class="report-scroll-wrap" id="result-container">
                        <!-- Dynamic Results & KDS Calculations injected by result_renderer.js -->
                        <div id="resultTable" style="display:none;"></div>
                    </div>
                </aside>
            </main>
        </div>
    </div>

    <!-- ========================================================= -->
    <!-- Script Architecture (Layered & Modular Zero-Build)        -->
    <!-- ========================================================= -->
    <!-- 0. Core Event Bus & Module Dispatcher & VDraw Layer -->
    <script src="/static/js/core/event_bus.js?v=20.8"></script>
    <script src="/static/js/core/dispatcher.js?v=20.8"></script>
    <script src="/static/js/core/context_menu.js?v=20.8"></script>
    <script src="/static/js/core/tree_menu.js?v=20.8"></script>
    <script src="/static/js/core/vdraw_engine.js?v=20.8"></script>
    <script src="/static/js/core/vdraw_primitives.js?v=20.8"></script>
    <script src="/static/js/core/pm_chart_vdraw.js?v=20.8"></script>
    <script src="/static/js/core/modal_manager.js?v=20.8"></script>
    <script src="/static/js/core/common_dialogs.js?v=20.8"></script>
    <script src="/static/js/core/form_builder.js?v=20.8"></script>
    <script src="/static/js/core/report_katex.js?v=20.8"></script>
    <script src="/static/js/core/report_renderer.js?v=20.8"></script>

    <!-- 0.1 Specialized Flagship Member Modules -->
    <script src="/static/js/modules/rc_beam/rc_beam_module.js?v=20.8"></script>
    <script src="/static/js/modules/rc_column/rc_column_module.js?v=20.8"></script>
    <script src="/static/js/modules/rc_slab/rc_slab_module.js?v=20.8"></script>
    <script src="/static/js/modules/steel_beam/steel_beam_module.js?v=20.8"></script>
    <script src="/static/js/modules/steel_baseplate/steel_baseplate_module.js?v=20.8"></script>

    <!-- 1. Central Store & Unit Management Layer (SSOT) -->
    <script src="/static/js/store/unit_manager.js?v=20.8"></script>
    <script src="/static/js/store/project_store.js?v=20.8"></script>

    <!-- 2. KS Standard DB Layer -->
    <script src="/static/js/db/ks_sections.js?v=20.8"></script>
    <script src="/static/js/db/rebar_db.js?v=20.8"></script>
    <script src="/static/js/db/ks_bolt_db.js?v=20.8"></script>

    <!-- 3. Vector SVG & Visual Graphics Layer (SSOT Shared) -->
    <script src="/static/js/visual/vector/vector_core.js?v=20.8"></script>
    <script src="/static/js/visual/vector/vector_wall.js?v=20.8"></script>
    <script src="/static/js/visual/vector/vector_footing.js?v=20.8"></script>
    <script src="/static/js/visual/vector/vector_slab.js?v=20.8"></script>
    <script src="/static/js/visual/vector/vector_steel.js?v=20.8"></script>
    <script src="/static/js/visual/vector/vector_rc_sec.js?v=20.8"></script>
    <script src="/static/js/visual/canvas_core.js?v=20.8"></script>
    <script src="/static/js/visual/legend_bar.js?v=20.8"></script>
    <script src="/static/js/visual/draw_rc.js?v=20.8"></script>
    <script src="/static/js/visual/draw_steel.js?v=20.8"></script>
    <script src="/static/js/visual/draw_pc_misc.js?v=20.8"></script>
    <script src="/static/js/visual/canvas_renderer.js?v=20.8"></script>

    <!-- 4. UI Components & Layout Layer -->
    <script src="/static/js/components/theme_manager.js?v=20.8"></script>
    <script src="/static/js/components/zoom_controller.js?v=20.8"></script>
    <script src="/static/js/components/layout_resizer.js?v=20.8"></script>
    <script src="/static/js/components/member_manager.js?v=20.8"></script>
    <script src="/static/js/components/form_combobox.js?v=20.8"></script>
    <script src="/static/js/components/form_generator.js?v=20.8"></script>

    <!-- 5. Optimal Designer Layer -->
    <script src="/static/js/designer/auto_designer.js?v=20.8"></script>

    <!-- 6. re-DCR Report & Sheet Calculation Layer -->
    <script src="/static/js/report/redcr/common/formatHelpers.js?v=20.8"></script>
    <script src="/static/js/report/redcr/common/verdictBadge.js?v=20.8"></script>
    <script src="/static/js/report/redcr/common/memberHeader.js?v=20.8"></script>
    <script src="/static/js/report/redcr/common/overviewSection.js?v=20.8"></script>
    <script src="/static/js/report/redcr/common/levelFactorsSection.js?v=20.8"></script>
    <script src="/static/js/report/redcr/reportUnitTransform.js?v=20.8"></script>
    <script src="/static/js/report/redcr/sheetFormulas.js?v=20.8"></script>
    <script src="/static/js/report/redcr/seismicSheetUtils.js?v=20.8"></script>
    <script src="/static/js/report/redcr/detailWrapper.js?v=20.8"></script>
    <script src="/static/js/report/redcr/BeamReportGenerator.js?v=20.8"></script>
    <script src="/static/js/report/redcr/ColumnCheckReportGenerator.js?v=20.8"></script>
    <script src="/static/js/report/redcr/SteelReportGenerator.js?v=20.8"></script>
    <script src="/static/js/report/redcr/WallCheckReportGenerator.js?v=20.8"></script>
    <script src="/static/js/report/redcr/FootingReportGenerator.js?v=20.8"></script>
    <script src="/static/js/report/redcr/SlabReportGenerator.js?v=20.8"></script>
    <script src="/static/js/report/redcr_common_renderer.js?v=20.8"></script>
    <script src="/static/js/report/result_renderer.js?v=20.8"></script>

    <!-- 7. AltDP_3rd Native Renderers & Utilities -->
    <script src="/static/js/renderer2d.js?v=20.8"></script>
    <script src="/static/js/pm_chart.js?v=20.8"></script>

    <!-- 8. App Orchestrator & Entry -->
    <script src="/static/js/app.js?v=20.8"></script>
</body>
</html>
