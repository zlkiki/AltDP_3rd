<!-- Pane 3: Draw View (CAD Drawing & Schedule Table Viewer) -->
<div class="main-form-view" id="view-draw">
  <div class="draw-workspace">
    <!-- Left Sidebar: Drawing Controls -->
    <aside class="draw-sidebar">
      <div style="padding:12px 14px; border-bottom:1px solid var(--border-subtle);">
        <h4 style="font-size:13px; font-weight:600; margin:0 0 10px 0;">도면 뷰어 옵션</h4>
        <div style="display:flex; flex-direction:column; gap:8px; font-size:12px;">
          <label>
            도면 유형:
            <select id="draw-type-select" style="width:100%; margin-top:4px; background:var(--bg-input); color:var(--text-primary); border:1px solid var(--border-glass); border-radius:4px; padding:4px;">
              <option value="section_rebar">단면 배근 상세도 (Cross Section)</option>
              <option value="elevation_rebar">부재 입/종단 배근도 (Elevation)</option>
              <option value="schedule_table">표준 배근 일람표 (Schedule Table)</option>
            </select>
          </label>

          <label style="display:flex; align-items:center; gap:6px; margin-top:6px;">
            <input type="checkbox" id="draw-show-dimensions" checked> 치수선 표기 (Dimensions)
          </label>
          <label style="display:flex; align-items:center; gap:6px;">
            <input type="checkbox" id="draw-show-rebartags" checked> 철근 태그 표기 (Tags)
          </label>
          <label style="display:flex; align-items:center; gap:6px;">
            <input type="checkbox" id="draw-show-grid" checked> 그리드/축선 표시 (Grid)
          </label>

          <div style="margin-top:16px; display:flex; flex-direction:column; gap:6px;">
            <button class="ribbon-btn-small" id="btn-draw-export-svg" style="justify-content:center; background:var(--bg-tertiary);">
              🖼️ SVG 벡터 저장
            </button>
            <button class="ribbon-btn-small" id="btn-draw-export-dxf" style="justify-content:center; background:var(--bg-tertiary);">
              📐 DXF CAD 파일 내보내기
            </button>
          </div>
        </div>
      </div>
    </aside>

    <!-- Resizer Vertical -->
    <div class="pane-resizer-v"></div>

    <!-- Center/Right: Interactive CAD Viewport -->
    <section class="draw-viewport" id="draw-viewport-container">
      <div style="position:absolute; top:12px; left:12px; z-index:10; background:rgba(0,0,0,0.6); padding:4px 10px; border-radius:4px; font-size:11px; color:#aaa;">
        마우스 휠: 줌(Zoom) | 드래그: 이동(Pan) | 축척: 1:20
      </div>
      <svg id="cadSvgViewport" style="width:100%; height:100%; cursor:grab;"></svg>
    </section>
  </div>
</div>
