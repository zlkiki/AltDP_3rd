<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}AltDP_3rd - KDS 웹 구조설계 시스템{% endblock %}</title>
  
  <!-- Design Tokens & CSS -->
  <link rel="stylesheet" href="/static/css/design_tokens.css">
  <link rel="stylesheet" href="/static/css/ribbon.css">
  <link rel="stylesheet" href="/static/css/views.css">
  <link rel="stylesheet" href="/static/css/style.css">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  {% block head_extra %}{% endblock %}
</head>
<body class="dark-theme">
  <!-- Top App Bar -->
  <header class="top-app-bar" style="display:flex; align-items:center; justify-content:space-between; padding:6px 16px; background:var(--bg-primary); border-bottom:1px solid var(--border-subtle); height:46px;">
    <div style="display:flex; align-items:center; gap:12px;">
      <div style="font-weight:700; font-size:15px; background:var(--accent-gradient); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">
        AltDP_3rd
      </div>
      <div style="font-size:11px; padding:2px 8px; border-radius:4px; background:var(--bg-tertiary); color:var(--text-secondary); border:1px solid var(--border-subtle);">
        KDS 14 20 00 / 14 31 00
      </div>
    </div>

    <!-- Center Quick P/S/M Interaction Mode -->
    <div class="mode-switcher-group" id="global-mode-switcher">
      <button class="mode-pill-btn active" data-mode="P" title="Parametric Auto-Design Mode">P-Mode (설계)</button>
      <button class="mode-pill-btn" data-mode="S" title="Section Strength Check Mode">S-Mode (검토)</button>
      <button class="mode-pill-btn" data-mode="M" title="Member Management Mode">M-Mode (관리)</button>
    </div>

    <!-- Right Controls: Unit / Theme / Status -->
    <div style="display:flex; align-items:center; gap:10px;">
      <!-- Unit Selector -->
      <select id="unit-selector" style="background:var(--bg-input); color:var(--text-primary); border:1px solid var(--border-glass); border-radius:var(--radius-xs); padding:3px 8px; font-size:11px; cursor:pointer;">
        <option value="SI" selected>SI (kN, mm, MPa)</option>
        <option value="MKS">MKS (tonf, m, kgf/cm²)</option>
        <option value="US">US (kip, in, ksi)</option>
      </select>

      <!-- Theme Toggle -->
      <button id="btnThemeToggle" class="ribbon-btn-small" title="테마 변경 (다크/라이트)">
        <span id="theme-icon">🌙</span>
      </button>
      
      <!-- Hidden compatibility buttons for legacy tests -->
      <div style="display:none;">
        <button data-type="cft_column">CFT</button>
        <button data-type="retrofit">Retrofit</button>
        <button data-type="section_db">SectionDB</button>
      </div>
      
      <!-- API Status Indicator -->
      <div style="display:flex; align-items:center; gap:5px; font-size:11px; color:var(--status-safe);">
        <span style="width:7px; height:7px; border-radius:50%; background:var(--status-safe); box-shadow:0 0 6px var(--status-safe-glow);"></span>
        <span>Online</span>
      </div>
    </div>
  </header>

  <!-- Ribbon Bar Navigation -->
  <nav class="ribbon-bar" id="ribbon-bar">
    <div class="ribbon-tabs-header">
      <button class="ribbon-tab-btn active" data-tab="tab-home">홈 (Home)</button>
      <button class="ribbon-tab-btn" data-tab="tab-rc">RC 부재설계</button>
      <button class="ribbon-tab-btn" data-tab="tab-steel">강구조설계</button>
      <button class="ribbon-tab-btn" data-tab="tab-fem">FEM 슬래브/기초</button>
      <button class="ribbon-tab-btn" data-tab="tab-report">구조계산서</button>
    </div>

    <!-- Tab 1: Home -->
    <div class="ribbon-content-body active" id="tab-home">
      <div class="ribbon-group">
        <div class="ribbon-group-items">
          <button class="ribbon-btn-large" id="btn-quick-rc-beam">
            <span style="font-size:20px;">🪵</span>
            <span>RC 보</span>
          </button>
          <button class="ribbon-btn-large" id="btn-quick-rc-col">
            <span style="font-size:20px;">🏛️</span>
            <span>RC 기둥</span>
          </button>
          <button class="ribbon-btn-large" id="btn-quick-steel-beam">
            <span style="font-size:20px;">🔩</span>
            <span>철골 보</span>
          </button>
        </div>
        <div class="ribbon-group-label">빠른 시작</div>
      </div>

      <div class="ribbon-group">
        <div class="ribbon-group-items">
          <button class="ribbon-btn-large" id="btn-run-check" style="color:var(--status-safe);">
            <span style="font-size:20px;">⚡</span>
            <span>단면검토</span>
          </button>
          <button class="ribbon-btn-large" id="btn-auto-design" style="color:var(--accent-primary);">
            <span style="font-size:20px;">✨</span>
            <span>자동설계</span>
          </button>
        </div>
        <div class="ribbon-group-label">설계/검토 실행</div>
      </div>

      <div class="ribbon-group">
        <div class="ribbon-group-items">
          <div class="ribbon-btn-col">
            <button class="ribbon-btn-small" id="btn-export-pdf">📄 PDF 출력</button>
            <button class="ribbon-btn-small" id="btn-export-excel">📊 Excel 내보내기</button>
          </div>
        </div>
        <div class="ribbon-group-label">보고서 출력</div>
      </div>
    </div>

    <!-- Tab 2: RC Members -->
    <div class="ribbon-content-body" id="tab-rc">
      <div class="ribbon-group">
        <div class="ribbon-group-items">
          <button class="ribbon-btn-large memb-select-btn" data-type="rc_beam"><span>RC 보</span></button>
          <button class="ribbon-btn-large memb-select-btn" data-type="rc_column"><span>RC 기둥</span></button>
          <button class="ribbon-btn-large memb-select-btn" data-type="rc_wall"><span>전단벽</span></button>
          <button class="ribbon-btn-large memb-select-btn" data-type="rc_slab"><span>슬래브</span></button>
          <button class="ribbon-btn-large memb-select-btn" data-type="rc_footing"><span>독립기초</span></button>
          <button class="ribbon-btn-large memb-select-btn" data-type="rc_retaining_wall"><span>옹벽</span></button>
        </div>
        <div class="ribbon-group-label">RC 부재 목록 (KDS 14 20 00)</div>
      </div>
    </div>

    <!-- Tab 3: Steel Members -->
    <div class="ribbon-content-body" id="tab-steel">
      <div class="ribbon-group">
        <div class="ribbon-group-items">
          <button class="ribbon-btn-large memb-select-btn" data-type="steel_beam"><span>철골 보</span></button>
          <button class="ribbon-btn-large memb-select-btn" data-type="steel_column"><span>철골 기둥</span></button>
          <button class="ribbon-btn-large memb-select-btn" data-type="steel_brace"><span>가새</span></button>
          <button class="ribbon-btn-large memb-select-btn" data-type="steel_connection"><span>접합부</span></button>
          <button class="ribbon-btn-large memb-select-btn" data-type="steel_baseplate"><span>베이스플레이트</span></button>
        </div>
        <div class="ribbon-group-label">강구조 부재 (KDS 14 31 00)</div>
      </div>
    </div>

    <!-- Tab 4: FEM -->
    <div class="ribbon-content-body" id="tab-fem">
      <div class="ribbon-group">
        <div class="ribbon-group-items">
          <button class="ribbon-btn-large" id="btn-fem-slab"><span>FEM 평판 슬래브</span></button>
          <button class="ribbon-btn-large" id="btn-fem-footing"><span>FEM 매트 기초</span></button>
        </div>
        <div class="ribbon-group-label">2D DKMQ 평판 솔버</div>
      </div>
    </div>

    <!-- Tab 5: Report -->
    <div class="ribbon-content-body" id="tab-report">
      <div class="ribbon-group">
        <div class="ribbon-group-items">
          <button class="ribbon-btn-large" id="btn-rep-summary"><span>요약보고서</span></button>
          <button class="ribbon-btn-large" id="btn-rep-standard"><span>표준계산서</span></button>
          <button class="ribbon-btn-large" id="btn-rep-detail"><span>상세감사보고서</span></button>
          <button class="ribbon-btn-large" id="btn-rep-batch"><span>일괄 바인딩 PDF</span></button>
        </div>
        <div class="ribbon-group-label">KDS 구조계산서 모드</div>
      </div>
    </div>
  </nav>

  <!-- 4-Main Form Views Navigation Bar -->
  <div class="views-nav-bar">
    <div class="views-tabs">
      <button class="view-tab-btn active" data-view="memb">
        <span>📐 단일 부재 (Memb View)</span>
      </button>
      <button class="view-tab-btn" data-view="list">
        <span>📋 부재 목록 (List View)</span>
        <span class="view-tab-badge" id="list-count-badge">5</span>
      </button>
      <button class="view-tab-btn" data-view="draw">
        <span>📏 배근 상세도 (Draw View)</span>
      </button>
      <button class="view-tab-btn" data-view="qntt">
        <span>📊 물량 산출 (Qntt View)</span>
      </button>
    </div>

    <div style="font-size:12px; color:var(--text-secondary);" id="active-member-indicator">
      현재 부재: <strong style="color:var(--accent-primary);">RC Beam (B1)</strong>
    </div>
  </div>

  <!-- Main Viewport Container -->
  <main class="viewport-container" id="main-viewport">
    {% block content %}{% endblock %}
  </main>

  <!-- Scripts -->
  <script src="/static/js/renderer2d.js"></script>
  <script src="/static/js/pm_chart.js"></script>
  <script src="/static/js/member_forms.js"></script>
  <script src="/static/js/batch_grid.js"></script>
  <script src="/static/js/draw_cad.js"></script>
  <script src="/static/js/qntt_summary.js"></script>
  <script src="/static/js/app.js"></script>
  {% block scripts_extra %}{% endblock %}
</body>
</html>
